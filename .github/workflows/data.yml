name: data
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: news
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-news.mjs
      - run: node scripts/fetch-weather.mjs
      - name: commit what changed
        run: |
          git config user.name "data-bot"
          git config user.email "actions@users.noreply.github.com"
          # news: only when a headline changed, not just the timestamp
          for f in news-*.json; do git diff --quiet -I '"updated"' -- "$f" || git add "$f"; done
          # weather and history: whenever the file changed
          for f in weather-*.json history-*.json; do git diff --quiet -- "$f" || git add "$f"; done
          git add -N . >/dev/null 2>&1 || true
          git add news-*.json weather-*.json history-*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            # someone (a person, or an overlapping run) may have pushed meanwhile
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs origin main || exit 1
            done
          fi
